name: Generate Resume PDF

on:
  push:
    branches: [master]
    paths:
      - resume.html
      - generate-pdf.js
      - .github/workflows/generate-resume-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate PDF
        run: node generate-pdf.js

      - name: Commit regenerated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Deepak-V-Dabekar.pdf
          git diff --cached --quiet || {
            git commit -m "chore: regenerate resume PDF [skip ci]"
            git push
          }
